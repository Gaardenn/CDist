name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'
            cache: maven
        
        - name: Build e testes
          run: ./mvnw -B verify